services:
  - type: web
    name: college-event-management
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: college-event-db
          property: connectionString

databases:
  - name: college-event-db
    databaseName: college_events
    user: college_events_user
