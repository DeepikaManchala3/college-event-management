{% extends 'base.html' %}
{% block content %}
<div class="role-wrap">
    <aside class="sidebar">
        <div class="nav-title">Admin</div>
        <nav class="nav-list">
            <a class="nav-item" href="{{ url_for('admin.dashboard') }}">Dashboard</a>
            <a class="nav-item" href="{{ url_for('admin.events') }}">Events</a>
            <a class="nav-item" href="{{ url_for('admin.approvals') }}">Event Approvals</a>
            <a class="nav-item" href="{{ url_for('admin.registrations') }}">Registrations</a>
            <a class="nav-item active" href="{{ url_for('admin.venues') }}">Venues</a>
            <a class="nav-item" href="{{ url_for('admin.reports') }}">Reports</a>
        </nav>
    </aside>

    <section class="main-panel">
        <div class="panel-header">
            <h2>Venues</h2>
        </div>
        <form method="post" class="form-card mb-3">
            <div class="form-grid">
                <label>Name<input name="name" required></label>
                <label>Capacity<input type="number" name="capacity" min="1" required></label>
                <label class="full">Location details<input name="location_details"></label>
            </div>
            <button class="btn btn-primary mt-3" type="submit">Create Venue</button>
        </form>
        {% for venue in venues %}
        <div class="status-card">
            <div>
                <h4>{{ venue.name }}</h4>
                <p>{{ venue.location_details }} | Capacity: {{ venue.capacity }}</p>
            </div>
            <form method="post" action="{{ url_for('admin.delete_venue', venue_id=venue.id) }}"><button class="btn btn-danger" type="submit">Delete</button></form>
        </div>
        {% else %}
        <div class="section-card">No venues configured.</div>
        {% endfor %}
    </section>
</div>
{% endblock %}
