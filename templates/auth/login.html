{% extends 'base.html' %}
{% block content %}
<div class="login-layout">
    <div class="login-card left-panel">
        <div class="logo-mark">🏫</div>
        <h1>College Event<br>Management System</h1>
        <p>Discover · Register · Participate</p>

        <div class="field-row">
            <span>📧</span>
            <input type="email" value="Email / Student ID" aria-label="Email input">
        </div>
        <div class="field-row">
            <span>🔒</span>
            <input type="password" value="Password" aria-label="Password input">
        </div>

        <label class="remember-row">
            <input type="checkbox">
            <span>Remember me</span>
        </label>

        <form method="POST" class="login-form">
            <input type="email" name="email" placeholder="Email / Student ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="primary-btn">Login</button>
        </form>

        <div class="login-divider">OR</div>
        <a href="{{ url_for('auth.register') }}" class="secondary-btn">Create Account</a>
    </div>
</div>
{% endblock %}
