{% extends 'base.html' %}
{% block content %}
<div class="role-wrap">
    <aside class="sidebar">
        <div class="nav-title">Organizer</div>
        <nav class="nav-list">
            <a class="nav-item" href="{{ url_for('organizer.dashboard') }}">Dashboard</a>
            <a class="nav-item" href="{{ url_for('organizer.events') }}">My Events</a>
            <a class="nav-item" href="{{ url_for('organizer.create_event') }}">Create Event</a>
            <a class="nav-item" href="{{ url_for('organizer.participants') }}">Participants</a>
            <a class="nav-item" href="{{ url_for('organizer.activities') }}">Activities</a>
            <a class="nav-item active" href="{{ url_for('organizer.announcements') }}">Announcements</a>
        </nav>
    </aside>

    <section class="main-panel">
        <div class="panel-header">
            <h2>Announcements - {{ event.title }}</h2>
        </div>
        <form method="post" class="form-card mb-3">
            <div class="form-grid">
                <label>Title<input name="title" required></label>
                <label class="full">Message<textarea name="message" rows="3" required></textarea></label>
            </div>
            <button class="btn btn-primary mt-3" type="submit">Publish Announcement</button>
        </form>
        {% for item in announcements %}
        <div class="announcement-card">
            <h4>{{ item.title }}</h4>
            <p>{{ item.message }}</p>
        </div>
        {% endfor %}
    </section>
</div>
{% endblock %}
