{% extends 'base.html' %}
{% block content %}
<div class="role-wrap">
    <aside class="sidebar">
        <div class="nav-title">Organizer</div>
        <nav class="nav-list">
            <a class="nav-item" href="{{ url_for('organizer.dashboard') }}">Dashboard</a>
            <a class="nav-item" href="{{ url_for('organizer.events') }}">My Events</a>
            <a class="nav-item active" href="{{ url_for('organizer.create_event') }}">Create Event</a>
            <a class="nav-item" href="{{ url_for('organizer.participants') }}">Participants</a>
            <a class="nav-item" href="{{ url_for('organizer.activities') }}">Activities</a>
            <a class="nav-item" href="{{ url_for('organizer.announcements') }}">Announcements</a>
        </nav>
    </aside>

    <section class="main-panel">
        <div class="panel-header">
            <h2>Create Event</h2>
        </div>

        <form class="form-card" method="post">
            <div class="form-grid two">
                <label>Event Name
                    <input type="text" name="title" value="{{ event.title if event else '' }}" required>
                </label>
                <label>Category
                    <select name="category" required>
                        {% for category in ['Technical', 'Cultural', 'Sports', 'Workshop'] %}
                        <option value="{{ category }}" {% if event and event.category == category %}selected{% endif %}>{{ category }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label>Date
                    <input type="date" name="event_date" value="{{ event.event_date.isoformat() if event else '' }}" required>
                </label>
                <label>Venue
                    <select name="venue_id" required>
                        <option value="">Select venue</option>
                        {% for venue in venues %}
                        <option value="{{ venue.id }}" {% if event and event.venue_id == venue.id %}selected{% endif %}>{{ venue.name }} (capacity {{ venue.capacity }})</option>
                        {% endfor %}
                    </select>
                </label>
                <label>Start Time
                    <input type="time" name="start_time" value="{{ event.start_time.strftime('%H:%M') if event else '' }}" required>
                </label>
                <label>End Time
                    <input type="time" name="end_time" value="{{ event.end_time.strftime('%H:%M') if event else '' }}" required>
                </label>
                <label class="full">Description
                    <textarea name="description" rows="4" required>{{ event.description if event else '' }}</textarea>
                </label>
                <label>Maximum Participants
                    <input type="number" name="max_capacity" value="{{ event.max_capacity if event else '' }}" min="1" required>
                </label>
            </div>
            <div class="event-actions">
                <button class="btn btn-primary" type="submit">{{ 'Update Event' if event else 'Submit to Admin' }}</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
